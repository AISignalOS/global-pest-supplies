<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Products — Global Pest Supplies</title>
  <meta name="description" content="Shop all 28 professional pest control products. Filter by pest type, product tier, and price. DIY and professional-grade options available.">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="custom-cursor.css">
  <script src="theme-toggle.js"></script>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
</head>
<body>

<script src="gps-shell.js"></script>

<div class="page-hero">
  <div class="container">
    <div class="page-hero-breadcrumb"><a href="index.html">Home</a> / All Products</div>
    <h1>All <span style="color:var(--blue-glow)">Products</span></h1>
    <p>28 professional-grade pest control products for homeowners and licensed exterminators.</p>
  </div>
</div>

<section class="section" style="padding-top:48px;">
  <div class="container">
    <div class="filter-layout">

      <!-- Sidebar Filters -->
      <aside class="filter-sidebar">
        <div class="filter-sidebar-title">Filters</div>

        <div class="filter-group">
          <div class="filter-group-label">Pest Type</div>
          <label class="filter-option"><input type="checkbox" value="ants" onchange="applyFilters()"> Ants <span class="filter-option-count" id="cnt-ants"></span></label>
          <label class="filter-option"><input type="checkbox" value="cockroaches" onchange="applyFilters()"> Cockroaches <span class="filter-option-count" id="cnt-cockroaches"></span></label>
          <label class="filter-option"><input type="checkbox" value="rodents" onchange="applyFilters()"> Rodents <span class="filter-option-count" id="cnt-rodents"></span></label>
          <label class="filter-option"><input type="checkbox" value="termites" onchange="applyFilters()"> Termites <span class="filter-option-count" id="cnt-termites"></span></label>
          <label class="filter-option"><input type="checkbox" value="mosquitoes" onchange="applyFilters()"> Mosquitoes <span class="filter-option-count" id="cnt-mosquitoes"></span></label>
          <label class="filter-option"><input type="checkbox" value="bedbugs" onchange="applyFilters()"> Bed Bugs <span class="filter-option-count" id="cnt-bedbugs"></span></label>
          <label class="filter-option"><input type="checkbox" value="fleas" onchange="applyFilters()"> Fleas &amp; Ticks <span class="filter-option-count" id="cnt-fleas"></span></label>
          <label class="filter-option"><input type="checkbox" value="wasps" onchange="applyFilters()"> Wasps &amp; Spiders <span class="filter-option-count" id="cnt-wasps"></span></label>
        </div>

        <div class="filter-group">
          <div class="filter-group-label">Tier</div>
          <label class="filter-option"><input type="checkbox" value="DIY" onchange="applyFilters()"> DIY / Home Use</label>
          <label class="filter-option"><input type="checkbox" value="Professional" onchange="applyFilters()"> Professional Grade</label>
        </div>

        <div class="filter-group">
          <div class="filter-group-label">Price Range</div>
          <label class="filter-option"><input type="checkbox" value="0-25" onchange="applyFilters()"> Under $25</label>
          <label class="filter-option"><input type="checkbox" value="25-50" onchange="applyFilters()"> $25 – $50</label>
          <label class="filter-option"><input type="checkbox" value="50-100" onchange="applyFilters()"> $50 – $100</label>
          <label class="filter-option"><input type="checkbox" value="100-999" onchange="applyFilters()"> $100+</label>
        </div>

        <div class="filter-group">
          <div class="filter-group-label">Rating</div>
          <label class="filter-option"><input type="checkbox" value="5" onchange="applyFilters()"> ★★★★★ Only</label>
          <label class="filter-option"><input type="checkbox" value="4" onchange="applyFilters()"> ★★★★☆ &amp; Up</label>
        </div>

        <button class="filter-clear" onclick="clearFilters()">Clear All Filters</button>
      </aside>

      <!-- Product Grid -->
      <div>
        <div class="sort-bar">
          <div class="sort-bar-count">Showing <span id="productCount">28</span> products</div>
          <select class="sort-select" onchange="applyFilters()">
            <option value="best">Best Selling</option>
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>
            <option value="rating">Top Rated</option>
            <option value="name">Name A–Z</option>
          </select>
        </div>
        <div class="product-grid" id="productGrid"></div>
        <div id="noResults" style="display:none;text-align:center;padding:64px 24px;color:var(--text-muted);">
          <div style="font-size:2.5rem;margin-bottom:16px;">🔍</div>
          <p style="font-size:1rem;margin-bottom:8px;color:var(--white);">No products match your filters.</p>
          <button class="btn-outline-blue" onclick="clearFilters()">Clear Filters</button>
        </div>
      </div>

    </div>
  </div>
</section>

<script src="catalog.js"></script>
<script src="shopify-storefront.js"></script>
<script src="main.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  updateCounts();
  applyFilters();
  const params = new URLSearchParams(location.search);
  const pest = params.get('pest');
  if (pest) {
    const cb = document.querySelector(`input[value="${pest}"]`);
    if (cb) { cb.checked = true; applyFilters(); }
  }
});

function updateCounts() {
  ['ants','cockroaches','rodents','termites','mosquitoes','bedbugs','fleas','wasps'].forEach(p => {
    const el = document.getElementById('cnt-' + p);
    if (el) el.textContent = byPest(p).length;
  });
}

function getChecked(name) {
  return [...document.querySelectorAll(`input[value="${name}"]`)].filter(e => e.checked).map(e => e.value);
}

function applyFilters() {
  const pestFilters  = [...document.querySelectorAll('.filter-group:nth-child(2) input:checked')].map(e => e.value);
  const tierFilters  = [...document.querySelectorAll('.filter-group:nth-child(3) input:checked')].map(e => e.value);
  const priceFilters = [...document.querySelectorAll('.filter-group:nth-child(4) input:checked')].map(e => e.value);
  const ratingFilters= [...document.querySelectorAll('.filter-group:nth-child(5) input:checked')].map(e => parseInt(e.value));
  const sort = document.querySelector('.sort-select')?.value || 'best';

  let products = CATALOG.slice();

  if (pestFilters.length) products = products.filter(p => p.pests.some(pest => pestFilters.includes(pest)));
  if (tierFilters.length) products = products.filter(p => tierFilters.includes(p.tier));

  if (priceFilters.length) {
    products = products.filter(p => priceFilters.some(range => {
      const [lo, hi] = range.split('-').map(Number);
      return p.price >= lo && p.price <= hi;
    }));
  }

  if (ratingFilters.length) {
    const minRating = Math.min(...ratingFilters);
    products = products.filter(p => p.rating >= minRating);
  }

  if (sort === 'price-asc') products.sort((a, b) => a.price - b.price);
  else if (sort === 'price-desc') products.sort((a, b) => b.price - a.price);
  else if (sort === 'rating') products.sort((a, b) => b.rating - a.rating);
  else if (sort === 'name') products.sort((a, b) => a.name.localeCompare(b.name));
  else products.sort((a, b) => (b.best ? 1 : 0) - (a.best ? 1 : 0));

  const grid = document.getElementById('productGrid');
  const noRes = document.getElementById('noResults');
  const count = document.getElementById('productCount');

  if (products.length === 0) {
    grid.innerHTML = '';
    noRes.style.display = 'block';
    if (count) count.textContent = '0';
  } else {
    grid.innerHTML = products.map(p => productCard(p)).join('');
    noRes.style.display = 'none';
    if (count) count.textContent = products.length;
  }
}

function clearFilters() {
  document.querySelectorAll('.filter-sidebar input[type="checkbox"]').forEach(cb => cb.checked = false);
  applyFilters();
}
</script>
</body>
</html>
