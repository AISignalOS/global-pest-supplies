<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="globeGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a3a6e"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Globe circle -->
  <circle cx="100" cy="100" r="80" fill="url(#globeGrad)" stroke="#1E6BFF" stroke-width="1.5"/>

  <!-- Latitude lines -->
  <ellipse cx="100" cy="100" rx="80" ry="20" fill="none" stroke="#1E6BFF" stroke-width="0.8" opacity="0.5"/>
  <ellipse cx="100" cy="100" rx="80" ry="50" fill="none" stroke="#1E6BFF" stroke-width="0.8" opacity="0.4"/>
  <line x1="20" y1="100" x2="180" y2="100" stroke="#1E6BFF" stroke-width="0.8" opacity="0.5"/>

  <!-- Longitude lines -->
  <ellipse cx="100" cy="100" rx="30" ry="80" fill="none" stroke="#1E6BFF" stroke-width="0.8" opacity="0.4"/>
  <ellipse cx="100" cy="100" rx="60" ry="80" fill="none" stroke="#1E6BFF" stroke-width="0.8" opacity="0.3"/>
  <line x1="100" y1="20" x2="100" y2="180" stroke="#1E6BFF" stroke-width="0.8" opacity="0.5"/>

  <!-- Crosshair -->
  <circle cx="100" cy="100" r="18" fill="none" stroke="#1E6BFF" stroke-width="2" filter="url(#glow)"/>
  <line x1="82" y1="100" x2="92" y2="100" stroke="#1E6BFF" stroke-width="2.5" filter="url(#glow)"/>
  <line x1="108" y1="100" x2="118" y2="100" stroke="#1E6BFF" stroke-width="2.5" filter="url(#glow)"/>
  <line x1="100" y1="82" x2="100" y2="92" stroke="#1E6BFF" stroke-width="2.5" filter="url(#glow)"/>
  <line x1="100" y1="108" x2="100" y2="118" stroke="#1E6BFF" stroke-width="2.5" filter="url(#glow)"/>
  <circle cx="100" cy="100" r="4" fill="#1E6BFF" filter="url(#glow)"/>

  <!-- Network nodes -->
  <circle cx="55" cy="70" r="3" fill="#3A8AFF" opacity="0.9"/>
  <circle cx="145" cy="65" r="3" fill="#3A8AFF" opacity="0.9"/>
  <circle cx="130" cy="130" r="3" fill="#3A8AFF" opacity="0.9"/>
  <circle cx="65" cy="140" r="3" fill="#3A8AFF" opacity="0.9"/>
  <circle cx="160" cy="100" r="2.5" fill="#3A8AFF" opacity="0.7"/>
  <circle cx="40" cy="105" r="2.5" fill="#3A8AFF" opacity="0.7"/>
  <line x1="55" y1="70" x2="145" y2="65" stroke="#3A8AFF" stroke-width="0.5" opacity="0.4"/>
  <line x1="145" y1="65" x2="130" y2="130" stroke="#3A8AFF" stroke-width="0.5" opacity="0.4"/>
  <line x1="130" y1="130" x2="65" y2="140" stroke="#3A8AFF" stroke-width="0.5" opacity="0.4"/>
  <line x1="65" y1="140" x2="55" y2="70" stroke="#3A8AFF" stroke-width="0.5" opacity="0.4"/>
  <line x1="55" y1="70" x2="100" y2="100" stroke="#3A8AFF" stroke-width="0.5" opacity="0.3"/>
  <line x1="145" y1="65" x2="100" y2="100" stroke="#3A8AFF" stroke-width="0.5" opacity="0.3"/>
  <line x1="160" y1="100" x2="130" y2="130" stroke="#3A8AFF" stroke-width="0.5" opacity="0.3"/>
</svg>
